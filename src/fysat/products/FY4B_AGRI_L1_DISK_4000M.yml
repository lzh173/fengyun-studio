pending_verification:
  - "LUT 查表用 nearest 还是 linear：calib.lookup_table 支持两种，实测差异小于一个 DN 的斜率。目前取 nearest 与 test_calib.py 的口径一致，但文档 3.1/3.2 只写「查找表法」未指明插值方式，属待核对。"
  - "CALIBRATION_COEF(SCALE+OFFSET) 公式法（文档 L594-601）未实现，当前只用 LUT。两种方法应给出一致结果，建议补一个交叉校验测试。"
  - "ESUN（[3,1]）与表观反射率换算未实现；真彩色目前走 pipeline 的经验白平衡。"
  - "「地球内无效像素 65534」（文档 L686）已纳入 dn.in_earth_invalid 掩膜，但尚未用真实文件统计过 65534 的实际像元数，需复核掩膜的合理性。"

notes:
  - "1000M 档位只有 3 个可见光通道（见 FY4B_AGRI_L1_DISK_1000M.yml），红外算法验证必须用 4000M 或 2000M。"
