      fill: 65535
      in_earth_invalid: 65534
    calib:
      method: lut_reflectance
      lut: /Calibration/CALChannel01
      lut_kind: nearest
      # 文档 L674/L982：CALChannelXX 的 FillValue = -65535.0，表内该值代表无效
      lut_fill: -65535.0
