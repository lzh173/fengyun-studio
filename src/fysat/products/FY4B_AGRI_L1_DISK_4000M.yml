#       FY4B_AGRI_DISK_L1_4KM_HDF_V1.0.md
#   - L99-L118   NOMChannel01..15：01=0.47 / 02=0.65 / 03=0.825 / 04=1.379 / 05=1.61 /
#                06=2.225 / 07=3.75(high) / 08=3.75(low) / 09=6.25 / 10=6.95 /
#                11=7.42 / 12=8.55 / 13=10.80 / 14=12.00 / 15=13.3 µm
#   - L119-L139   CALChannel01..15  定标表
#   - L140        ESUN 平均日地距离处太阳辐照度
#   - 3.1/L588-603 反射通道：CALChannelXX 是 DN→反射率 的查找表（公式法用 CALIBRATION_COEF）
#   - 3.2/L636-646 热红外通道：CALChannelXX 是 DN→亮温(K) 的查找表
#   - L211-214     NOMChannelXX SDS 属性：valid_range 0,4095 / FillValue 65535 /
#                  Intercept 0.0 / Slope 1.0 / units "DN"
#   - L686         地球内无效像素填 65534，地球外无效像素填 65535
#
# 真实样本
#   Y:\download-data\**\FY4B-*_4000M_V0001.HDF（12 个，1.11 GB）
#
# 已通过的真实样本回归（tests/test_fy4b_family.py / test_calib.py）
#   test_4000m_has_15_channels                      Data/NOMChannel* 恰好 15 个
#   test_visible_lut_is_fraction_not_percent        CH01 LUT 最大值落在 (0.5, 2.0) → 0~1.14
#   test_thermal_lut_is_kelvin                      CH12 LUT 值域 110~405 K
#   test_fy4b_ch01_lut_reflectance_percent          DN=1000→26.2868%，DN=4095→114.31%
#   test_calibrated_temperature_is_physical         定标后亮温 150~350 K
product: FY4B_AGRI_L1_DISK_4000M
title: FY-4B AGRI L1 全圆盘 4000M（15 通道全）
platform: FY-4B
instrument: AGRI
level: L1
container: hdf5
verified: true

match:
  # 实测文件名：FY4B-_AGRI--_N_DISK_1050E_L1-_FDI-_MULT_NOM_20261030154500_..._4000M_V0001.HDF
  filename: '^FY4B.*_4000M_V\d+\.HDF$'
  container: hdf5

evidence:
  document: "D:\\desktop_dp\\temp\\nsmc-doc\\md\\数据格式说明\\FY-4B数据格式说明\\FY4B_AGRI_DISK_L1_4KM_HDF_V1.0.md"
  document_lines:
    - "L99-118 NOMChannel01..15 中心波长（0.47/0.65/0.825/1.379/1.61/2.225/3.75h/3.75l/6.25/6.95/7.42/8.55/10.80/12.00/13.3 µm）"
    - "L119-139 CALChannel01..15 定标表"
    - "L211-214 SDS 属性 valid_range 0,4095 / FillValue 65535 / units DN"
    - "L588-603 反射通道：CALChannelXX 为 DN→反射率查找表"
    - "L636-646 热红外通道：CALChannelXX 为 DN→亮温(K) 查找表"
    - "L686 地球内无效像素 65534，地球外 65535"
  samples:
    - "Y:\\download-data\\**\\FY4B-*_4000M_V0001.HDF（12 个）"
  tests:
    - "tests/test_fy4b_family.py::test_4000m_has_15_channels"
    - "tests/test_fy4b_family.py::test_visible_lut_is_fraction_not_percent（CH01 LUT max 落在 0.5~2.0）"
    - "tests/test_fy4b_family.py::test_thermal_lut_is_kelvin（CH12 LUT 110~405 K）"
    - "tests/test_calib.py::test_fy4b_ch01_lut_reflectance_percent（DN=1000→26.2868%）"
    - "tests/test_fy4b_family.py::test_calibrated_temperature_is_physical"

geolocation:
  method: nominal
  notes:
    - "全圆盘标称投影 (2748, 2748)，像元 4000 m（文档 L238 维数 [2748,2748]）"
    - "sub_lon 取全局属性 NOMCenterLon（填充值 65535 无效）；sat_height 取 NOMSatHeight（米）"
    - "文档 L220-221 另有 dSamplingAngle（东西采样角）与 dSteppingAngle（南北步进角），单位微弧度，可替代 pixel_size 的更精确算法"

