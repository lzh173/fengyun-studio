name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 代码风格
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check src tests scripts packaging
      - name: ruff format --check
        run: ruff format --check src tests scripts packaging
        continue-on-error: true      # 格式暂不作为门禁，先只提示

  # ---------------------------------------------------------------- 单元测试
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    env:
      # 无显示环境跑 GUI 相关用例
      QT_QPA_PLATFORM: offscreen
      # 不配置 FYSAT_SAMPLE_ROOT：需要真实卫星产品的用例会自动 skip
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装系统依赖（Linux 上 Qt 需要的运行库）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            fonts-noto-cjk

      - name: 安装项目
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: 确认包内数据完整（产品定义 / 合成配方 / 海岸线）
        run: python -c "from fysat.products.loader import PRODUCTS_DIR; import pathlib; n=len(list(pathlib.Path(PRODUCTS_DIR).glob('*.yml'))); print('products:', n); assert n >= 9, '产品定义缺失'"
        shell: bash

      - name: 跑测试
        run: python -m pytest tests -q --tb=short

      - name: 无样本时必须有 skip 而不是失败
        run: python -m pytest tests -q --tb=no
        shell: bash
        continue-on-error: true

  # ---------------------------------------------------------------- 打包冒烟
  wheel:
    name: 构建 wheel 并验证数据文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build --wheel
      - name: 检查 wheel 里必须有产品定义与海岸线
        run: |
          python - <<'PY'
          import sys, zipfile, pathlib
          whl = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(whl).namelist()
          need = ["fysat/products/FY3_MERSI_L1_1000M.yml",
                  "fysat/composites/bands.yml",
                  "fysat/composites/composites.yml",
                  "fysat/assets/ne_110m_coastline.geojson"]
          missing = [n for n in need if n not in names]
          print(f"{whl.name}: {len(names)} 个条目")
          if missing:
              print("缺失:", missing)
              sys.exit(1)
          print("包内数据完整")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
