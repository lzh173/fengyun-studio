[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fengyun-studio"
version = "0.1.0"
description = "风云卫星官方数据解码 · 分析 · 制图"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
keywords = ["fy", "fengyun", "satellite", "remote-sensing", "nsmc", "mersi", "agri", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "pillow>=10",
    "tifffile>=2023.7",
    "pyyaml>=6",
    "scipy>=1.10",          # nc3 读取器（NetCDF-3，scipy.io.netcdf_file）
]

[project.urls]
Homepage = "https://github.com/lzh173/fengyun-studio"
Documentation = "https://github.com/lzh173/fengyun-studio/blob/main/README.md"
Issues = "https://github.com/lzh173/fengyun-studio/issues"
Changelog = "https://github.com/lzh173/fengyun-studio/blob/main/PLAN.md"
Source = "https://github.com/lzh173/fengyun-studio"

[project.optional-dependencies]
# 许可证：PySide6 元包会连带安装 PySide6-Addons，
# 其中包含 Qt Charts / DataVisualization / Quick3D / VirtualKeyboard 等
# GPLv3-only 模块，与我们的 LGPLv3 方案冲突。
# 因此**只声明 Essentials**，绝不要写成 "PySide6"。
gui = ["PySide6-Essentials==6.12.0"]
# netCDF4 是 GPL 兼容但未审计的可选依赖，仅在确实需要时启用
nc3 = ["netCDF4>=1.6"]
# satpy 是**可选增强**（不是替代）：复用它的 FY-3 MERSI / FY-4 AGRI L1 定标。
# 许可证 GPLv3-or-later，与我们 AGPL-3.0-only 兼容（GPLv3 §13 / AGPLv3 §13），
# 依据与取舍见 analysis/satpy_evaluation.md。
# 依赖很重（dask/xarray/zarr/pyresample/pyspectral，实装约 370 MB），
# 所以**绝不进主依赖**；没装时项目一切照旧。
satpy = ["satpy>=0.50", "pyspectral"]
dev = ["pytest>=7", "ruff>=0.4"]
# 一次性装齐（GUI + satpy）
all = ["PySide6-Essentials==6.12.0", "satpy>=0.50", "pyspectral"]

[project.scripts]
fysat = "fysat.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES.md", "THIRD_PARTY_NOTICES.md"]

# 发行名是 fengyun-studio，但 **import 名保持 fysat**。
# 这是常见做法（Pillow → import PIL、beautifulsoup4 → import bs4），
# 改导入名要动 src 下所有 from fysat. 引用，收益不抵风险。
[tool.setuptools.package-data]
# 这些 YAML/GeoJSON 是运行时必需数据（产品定义、合成配方、海岸线），
# 不声明的话 pip 装出来的包会缺文件，程序启动即报找不到产品定义。
fysat = [
    "products/*.yml",
    "composites/*.yml",
    "assets/*.geojson",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "out", "build", "dist", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]        # 行宽由 formatter 处理，注释里有长链接

[tool.ruff.lint.per-file-ignores]
# 开发脚本要在 sys.path 注入之后才能 import fysat，所以 E402 是必然的；
# 其余几条是内部工具的写法习惯，不影响发行代码质量。
"scripts/*" = ["E402", "E702", "B007", "UP031", "B904"]
"analysis/*" = ["E402", "E702", "B007", "UP031", "B904"]
"tests/*" = ["E402", "B007"]
