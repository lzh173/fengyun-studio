[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fysat"
version = "0.1.0"
description = "风云卫星官方数据解码 · 分析 · 制图"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
keywords = ["fy", "fengyun", "satellite", "remote-sensing", "nsmc", "mersi", "agri", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "pillow>=10",
    "tifffile>=2023.7",
    "pyyaml>=6",
    "scipy>=1.10",          # nc3 读取器（NetCDF-3，scipy.io.netcdf_file）
]

# TODO(发布前)：把下面的 <org> 换成实际组织/用户名
[project.urls]
Homepage = "https://github.com/<org>/fysat"
Documentation = "https://github.com/<org>/fysat/blob/main/README.md"
Issues = "https://github.com/<org>/fysat/issues"
Changelog = "https://github.com/<org>/fysat/blob/main/PLAN.md"

[project.optional-dependencies]
# 许可证：PySide6 元包会连带安装 PySide6-Addons，
# 其中包含 Qt Charts / DataVisualization / Quick3D / VirtualKeyboard 等
# GPLv3-only 模块，与我们的 LGPLv3 方案冲突。
# 因此**只声明 Essentials**，绝不要写成 "PySide6"。
gui = ["PySide6-Essentials==6.12.0"]
# netCDF4 是 GPL 兼容但未审计的可选依赖，仅在确实需要时启用
nc3 = ["netCDF4>=1.6"]
# satpy 是**可选增强**（不是替代）：复用它的 FY-3 MERSI / FY-4 AGRI L1 定标。
# 许可证 GPLv3-or-later，与我们 AGPL-3.0-only 兼容（GPLv3 §13 / AGPLv3 §13），
# 依据与取舍见 analysis/satpy_evaluation.md。
# 依赖很重（dask/xarray/zarr/pyresample/pyspectral，实装约 370 MB），
# 所以**绝不进主依赖**；没装时项目一切照旧。
satpy = ["satpy>=0.50", "pyspectral"]
dev = ["pytest>=7", "ruff>=0.4"]
# 一次性装齐（GUI + satpy）
all = ["PySide6-Essentials==6.12.0", "satpy>=0.50", "pyspectral"]

[project.scripts]
fysat = "fysat.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "out", "build", "dist", "analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]        # 行宽由 formatter 处理，注释里有长链接
